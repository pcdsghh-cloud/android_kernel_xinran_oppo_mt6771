# ============================================================================
#  R15 (CPH1835 / PACM00, mt6771) kernel build workflow  [修正版 v2]
#  基于 Winkmoon/android_kernel_xinran_oppo_mt6771 的原版 build.yml 改造
#
#  【v2 修正说明 - 重要】
#  上一版让 dtc 反解 R15 设备树再手动 cat 到 kernel 尾部 —— 这是多余的，
#  而且可能和 MTK 构建系统自带的 appended DTB 形成"双 DTB"冲突。
#  原版作者验证过的方式是：只编译通用 4.14.336 内核 (Image)，
#  然后 AnyKernel3 在刷入时自动保留【你手机里现成的 R15 原厂 DTB 和 ramdisk】，
#  只替换 kernel 二进制。这比我反解的扁平 DTB 更可靠。
#  所以本版：不依赖 r15_board_decompiled.dts，直接照抄原版编译+打包逻辑。
#
#  用法：
#   1. 把本文件覆盖到 fork 仓库的 .github/workflows/build_r15_kernel.yml
#   2. Actions -> "生产构建R15" -> Run workflow
#   3. 下载产物 Kernel_R15-ak3.zip
#   4. OrangeFox 刷入 (AnyKernel3 只换 kernel，保留你的 ramdisk/DTB)
#
#  ⚠ 风险：A9 是 4.14.336，R15 原厂是 4.14.141。同属 4.14 系列，
#  通用驱动大体兼容，但 MTK 私有驱动（相机/指纹/充电）版本不同，
#  部分硬件可能失效。必须实机测试，先备份。
# ============================================================================
name: 生产构建R15

env:
  TZ: Asia/Shanghai
  KERNEL_VERSION: '4.14'
  KERNEL_NAME: 'ran-r15'

on:
  workflow_dispatch:
    inputs:
      kernel_suffix:
        description: '内核后缀(可选,开头别加连字符)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 最大化构建空间
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: 缓存 LLVM 工具链
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: clang
          key: llvm-23.1.5-${{ runner.os }}

      - name: 安装依赖
        run: |
          sudo apt update -y
          sudo apt install -y build-essential flex bison dwarves libssl-dev \
            libelf-dev bc python3 python-is-python3 make cmake zip curl wget \
            gnupg ccache rsync binutils-aarch64-linux-gnu
          if [ ! -d clang ]; then
            wget -O LLVM.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/LLVM-23.1.5-Linux-X64.tar.xz
            tar -xvaf LLVM.tar.xz
            mv LLVM-23.1.5-Linux-X64 clang
            rm -f LLVM.tar.xz
          else
            echo "命中 LLVM 缓存"
          fi
          echo "CLANG_PATH=$(pwd)/clang" >> $GITHUB_ENV
          echo "PATH=$(pwd)/clang/bin:$PATH" >> $GITHUB_ENV

      - name: 初始化内核源码
        run: |
          rm -rf kernel_workspace && mkdir kernel_workspace && cd kernel_workspace
          git clone --depth=1 https://github.com/Winkmoon/android_kernel_xinran_oppo_mt6771 -b android11 common
          cd common
          rm -f android/abi_gki_protected_exports_* || true
          touch .scmversion
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' Makefile

      - name: 集成 KernelSU
        run: |
          cd kernel_workspace/common
          curl -LSs "https://raw.githubusercontent.com/rksuorg/KernelSU/main/kernel/setup.sh" | bash -s main
          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/oppo6771_defconfig
          echo "CONFIG_KSU_TOOLKIT_SUPPORT=y" >> ./arch/arm64/configs/oppo6771_defconfig

      - name: 设置后缀
        run: |
          cd kernel_workspace/common
          suffix="${{ inputs.kernel_suffix }}"
          if [ -n "$suffix" ]; then
            sed -i '/^CONFIG_LOCALVERSION=/d' ./arch/arm64/configs/oppo6771_defconfig
            echo "CONFIG_LOCALVERSION=\"-R15-$suffix\"" >> ./arch/arm64/configs/oppo6771_defconfig
          else
            sed -i '/^CONFIG_LOCALVERSION=/d' ./arch/arm64/configs/oppo6771_defconfig
            echo "CONFIG_LOCALVERSION=\"-R15\"" >> ./arch/arm64/configs/oppo6771_defconfig
          fi
          grep -n 'CONFIG_LOCALVERSION' ./arch/arm64/configs/oppo6771_defconfig

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: 编译内核
        run: |
          cd kernel_workspace/common
          export PATH=$CLANG_PATH/bin:$PATH
          export CCACHE_DIR=$HOME/.ccache CCACHE_MAXSIZE=2G CCACHE_COMPRESS=true
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" HOSTCC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip O=out KCFLAGS=-Wno-error TARGET_PRODUCT=full_oppo6771 oppo6771_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" HOSTCC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip O=out KCFLAGS=-Wno-error TARGET_PRODUCT=full_oppo6771 -j32
          test -s out/arch/arm64/boot/Image || { echo "::error::Image 缺失,编译失败"; exit 1; }
          sha256sum out/arch/arm64/boot/Image
          echo "内核编译成功"

      - name: 打包 AnyKernel3 (保留手机原厂DTB与ramdisk)
        run: |
          cd kernel_workspace/common
          git clone https://github.com/Winkmoon/AnyKernel3 --depth=1 AnyKernel3
          rm -rf AnyKernel3/.git
          cd AnyKernel3
          cp ../out/arch/arm64/boot/Image ./Image
          ls -l ./Image
          zip -r ../Kernel_R15-ak3.zip ./*
          ls -l ../Kernel_R15-ak3.zip

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_R15-ak3
          path: kernel_workspace/common/Kernel_R15-ak3.zip
